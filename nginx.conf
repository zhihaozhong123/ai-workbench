# 小书童后端反向代理（多副本负载入口）
# 前端 / 桌面 .app 统一连 http://127.0.0.1:8000，由 nginx 转发到 backend 容器池。
# 扩容：docker compose up -d --scale backend=2（多个 backend 容器经 Docker 内部 DNS 轮询）

# Docker 内置 DNS：按 valid 周期重新解析 backend 服务名（副本增减自动感知，避免启动时缓存单 IP）
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    # resolve 需配共享内存 zone（开源 nginx ≥1.27.3 支持，当前镜像 nginx:1.27-alpine 满足）
    zone backend 64k;
    # Docker DNS 对服务名返回全部副本 IP，nginx 轮询分发；resolve 使其周期性刷新副本列表
    server backend:8000 resolve;
}

server {
    listen 80;
    client_max_body_size 50m;

    # ---- 更新清单 JSON（app 启动时检测更新，Tauri updater 请求此端点）----
    # Tauri 发起 GET /update/darwin/arm64/{current_version}，
    # nginx 忽略版本号参数，固定返回对应架构的 update_arm64.json
    location ~ ^/update/ {
        alias /var/www/updates/;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- DMG 安装包下载（更新清单 JSON 中的 url 指向这里）----
    location /download/ {
        alias /var/www/updates/downloads/;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---- 后端 API + WebSocket（所有其他请求转发到 backend 池）----
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 支持（/ws/chat 实时聊天 + 本机控制通道）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
