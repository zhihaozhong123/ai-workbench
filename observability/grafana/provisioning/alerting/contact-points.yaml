# 智作台 - Grafana 告警通知渠道
# url 由 grafana 容器环境变量 ALERT_WEBHOOK_URL 注入（见 docker-compose.yml），
# 默认占位 http://localhost:5001/alerts，请改为你的接收端（如飞书/钉钉/企业微信 webhook 网关）。
apiVersion: 1
contactPoints:
  - name: default
    receivers:
      - uid: webhook-default
        type: webhook
        settings:
          url: ${ALERT_WEBHOOK_URL}
          httpMethod: POST
          maxAlerts: 0
