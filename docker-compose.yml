# 智作台后端 - 生产编排（支持无状态多实例水平扩展）
#
# 多实例前置条件（三者齐备即可横向扩容，无需改代码）：
#   1) Chroma 固定 client/server 模式（连 chroma 服务，原生 tenant 隔离）
#   2) 共享协调走 Redis（REDIS_URL → 锁 / 建索引信号量 / 校准队列 / 缓存失效 / 黑名单）
#   3) 主库用 PostgreSQL（已含）
#
# 另有运维支撑服务（均默认启用，可单独 scale/停用）：
#   - prometheus：抓取后端 /metrics（./prometheus.yml），:9090
#   - loki      ：集中日志存储（filesystem，保留 7 天），:3100；解决 stdout 轮转/重建丢历史、多副本分散
#   - promtail  ：读 docker 容器日志 → loki（docker.sock 服务发现 + JSON 解析），内部 :9080
#   - grafana   ：统一看板与告警（预置 Loki/Prometheus 数据源、审计看板、告警规则），:3000
#   - pg-backup ：PostgreSQL 每日全量 dump，落 pg_backups 卷，保留 7 天
#   - 资源限制：backend/redis/chroma/prometheus/loki/promtail/grafana/pg-backup 均设 CPU/内存 limits
#   - 容器以非 root 运行（见 Dockerfile 的 appuser）
#
# 单节点（不横向扩容）最简部署：保留 redis service（REDIS_URL 现已必填，协调状态必须走 Redis），
# chroma 固定连共享 chroma 服务（无需 persistent 本地文件模式）；要横向扩容时直接加大 backend.replicas。
services:
  backend:
    build: .
    # 多实例：共享状态由 Redis + Chroma server 承担，每个容器仍 1 个 worker（同容器内多 worker 仍会状态不一致）
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    # 不再直接暴露端口：统一由下方 nginx 反向代理（8000→backend 池），
    # 以便 `docker compose up -d --scale backend=2` 横向扩容而不端口冲突。
    # [2026-07-26] 切回 docker 内 pg/redis：用服务名 db:5432 / redis:6379 连接，
    # 带账号密码 xiaoshutong；宿主机端口 5432/6379 留给本机 Homebrew 实例，互不干扰。
    environment:
      - ENV=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=xiaoshutong
      - DB_USER=xiaoshutong
      - DB_PASSWORD=${POSTGRES_PASSWORD:-xiaoshutong}
      - REDIS_URL=redis://xiaoshutong:${REDIS_PASSWORD:-xiaoshutong}@redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - JWT_SECRET=${JWT_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ALIYUN_EMBEDDING_API_KEY=${ALIYUN_EMBEDDING_API_KEY}
      - LOG_FORMAT=json                 # JSON 日志，便于 Loki/ELK/Vector 采集
      - AUDIT_ENABLED=${AUDIT_ENABLED:-true}
    # 注入项目 .env 的全部配置，补充 environment 未覆盖的必填项
    # （如 DEEPSEEK_MODEL / ALIYUN_EMBEDDING_MODEL / KB_MAX_PER_TENANT / SERPAPI_API_KEY 等，
    #  否则这些字段缺失会触发 pydantic 校验失败 → 容器崩溃 → backend unhealthy）。
    # 注意：environment 段优先级高于 env_file，其中 DB_HOST=db / CHROMA_HOST=chroma /
    # CHROMA_PORT=8000 / REDIS_URL 等容器内网络地址会正确覆盖 .env 里的 localhost 值。
    env_file: .env
    volumes:
      - app_data:/app/data              # 用户库 / 冷记忆等（不含向量，向量在 chroma 服务）
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    restart: unless-stopped
    # ===== 探针设计约定（liveness 与 readiness 分离，勿改回 /readyz）=====
    # - liveness（docker 据此杀容器重启）：只用 /healthz，仅校验「进程存活 + DB 可达」。
    #   DB 是硬依赖，DB 挂了重启才有意义。
    # - readiness（能否接流量）：另有 /readyz（DB+Redis），保留作就绪信号，
    #   但【不】交给 docker 当探针——Redis 属软依赖，抖动/重启时重启后端救不了
    #   Redis，反而每次冷启动几十秒、期间全 502，触发连锁雪崩。后端靠
    #   get_redis() 懒加载 + health_check_interval=30 自愈，无需杀容器。
    # - start_period：lifespan 要连 PG 建库/建表、初始化 KB embedding、加载 agent、
    #   订阅 Redis，偶发慢（网络/Chroma）可能 > 75s，无宽限期会被提前判 unhealthy → 重启循环。
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  db:
    image: postgres:16-alpine
    # 映射宿主机 15432 → 容器 5432，避让宿主机本地 pg(5432)。
    # 宿主机脚本连 localhost:15432，docker 内服务用服务名 db:5432。
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_USER=xiaoshutong
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-xiaoshutong}
      - POSTGRES_DB=xiaoshutong
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaoshutong"]
      interval: 5s
      timeout: 3s
      retries: 10
      # 启动宽限期：PG 首次初始化/冷启动可能较慢，宽限期内失败不计入 unhealthy，
      # 避免偶发慢启动被直接判死（注意：真正的「No space left on device」是磁盘满，需清磁盘）。
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    # 映射宿主机 16379 → 容器 6379，避让宿主机本地 redis(6379)。
    ports:
      - "16379:6379"
    # ACL：创建用户 xiaoshutong（密码 xiaoshutong，全权限），禁用 default 用户。
    # +@all=所有命令, ~*=所有 key, &*=所有频道(pub/sub), >pwd=密码。
    # 整行传 shell 执行：'&*' 单引号保护 &，">${...}" 双引号允许变量展开且 > 不触发重定向。
    command: redis-server --appendonly yes --user xiaoshutong on +@all ~* '&*' ">${REDIS_PASSWORD:-xiaoshutong}" --user default off
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "xiaoshutong", "--pass", "${REDIS_PASSWORD:-xiaoshutong}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  chroma:
    image: chromadb/chroma:1.5.9
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8000
    ports:
      - "18001:8000"
    volumes:
      # 1.5.9 镜像实际持久化目录为 /data（启动日志 "Saving data to: /data"），勿用旧版路径 /chroma/chroma
      - chroma_data:/data
    # 1.5.9 为单二进制镜像（无 curl/wget/python）：经 /proc/net/tcp 检测 8000(0x1F40) 处于 LISTEN(0A)
    healthcheck:
      test: ["CMD-SHELL", "grep -Eq ':1F40[[:space:]]+[^[:space:]]+[[:space:]]+0A' /proc/net/tcp /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ---------- 反向代理：统一入口（多副本 backend 经此处负载）----------
  # 前端 / 桌面 .app 仍连 http://127.0.0.1:8000，由 nginx 转发到 backend 池。
  # 扩容：docker compose up -d --scale backend=2
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    # 仅约定启动顺序（service_started），【不】加 condition: service_healthy：
    # 否则 nginx 会反过来等 backend 变 healthy 才启动，backend 启动慢/探活窗口内
    # 会被卡住，形成「nginx 等 backend、backend 等起来」的额外阻塞。
    # backend 起来后 nginx 自然代理即可；启动期个别请求 502 是可接受的瞬时代价。
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./updates:/var/www/updates:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------- 可观测性：Prometheus 抓取 /metrics（item 5）----------
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ---------- 可观测性：Loki 日志存储（集中留存审计/应用日志）----------
  # 接 Promtail 推送，保留 7 天（loki-config.yaml 的 retention_period），
  # 避免 stdout 轮转/容器重建丢失历史；多副本 backend 日志统一汇聚，由 Grafana 统一查询/告警。
  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ---------- 可观测性：Promtail 日志采集（读 docker 容器日志 → Loki）----------
  # 通过 docker.sock 服务发现，解析 json-file 信封 + 应用层 JSON，
  # 提取 level/logger 标签；审计行完整保留 msg（action/user/detail/ip）供 LogQL 检索。
  promtail:
    image: grafana/promtail:2.9.8
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/loki/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - promtail_data:/promtail
    depends_on:
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ---------- 可观测性：Grafana 统一看板与告警 ----------
  # 预置 Loki + Prometheus 数据源、审计看板、告警规则/通知（见 observability/grafana/provisioning）。
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      # 默认 admin/changeme，生产请改 .env 的 GRAFANA_PASSWORD
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
      # 注入给 provisioning 的告警 webhook url（见 contact-points.yaml）
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-http://localhost:5001/alerts}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ---------- 可观测性：Redis 资源指标 exporter ----------
  # 暴露 Redis CPU/内存/连接数/命中率/命令数等，供 Grafana 看板与并发压测时判定
  # 「Redis 是否成为瓶颈」（之前并发分析中 Redis 是协调热点，缺这块指标）。
  # 走 ACL 用户 xiaoshutong（与 backend 同凭据），prometheus 抓 :9121。
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_USER=xiaoshutong
      - REDIS_PASSWORD=${REDIS_PASSWORD:-xiaoshutong}
    ports:
      - "9121:9121"
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ---------- 可观测性：PostgreSQL 资源指标 exporter ----------
  # 暴露 PG 连接数/活跃事务/锁/缓存命中率/慢查询等，供并发压测时判定
  # 「PG 连接池是否耗尽」（之前并发分析指出的潜在天花板）。
  # 用 db 所有者 xiaoshutong 同凭据连接，prometheus 抓 :9187。
  pg-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      - DATA_SOURCE_NAME=postgresql://xiaoshutong:${POSTGRES_PASSWORD:-xiaoshutong}@db:5432/xiaoshutong?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ---------- 可观测性：Chroma 探活（blackbox exporter）----------
  # Chroma 无官方 Prometheus exporter，用 blackbox 对 chroma:8000 做 HTTP 探活，
  # 暴露存活/延迟/状态码，补上并发压测时「Chroma 单服务是否成为瓶颈」的缺口。
  # 复用镜像内置的 http_2xx 模块，无需额外挂载配置文件。
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    ports:
      - "9115:9115"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ---------- 持久化：PostgreSQL 每日备份（item 4）----------
  # 启动即做一次全量 dump，之后每 24h 一次，本地保留 7 天（异地/对象存储自行再同步）。
  # 备份落在 pg_backups 卷；导出需手动 `docker compose cp` 或挂对象存储 sidecar。
  pg-backup:
    image: postgres:16-alpine
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=xiaoshutong
      - PGPASSWORD=${POSTGRES_PASSWORD:-xiaoshutong}
      - PGDATABASE=xiaoshutong
    volumes:
      - ./scripts/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - pg_backups:/backups
    command: ["/bin/sh", "-c", "sh /usr/local/bin/pg-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ---------- 持久化：Chroma 向量数据备份（item 4 补全）----------
  # 每 6h 对 chroma_data 卷做 tar 快照，保留 7 天（最佳努力；源文档可重建索引作兜底）。
  chroma-backup:
    image: alpine:3.20
    volumes:
      - chroma_data:/source:ro
      - ./scripts/chroma-backup.sh:/usr/local/bin/chroma-backup.sh:ro
      - chroma_backups:/backups
    command: ["/bin/sh", "-c", "sh /usr/local/bin/chroma-backup.sh"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M

volumes:
  app_data:
  pg_data:
  redis_data:
  chroma_data:
  prom_data:
  loki_data:
  promtail_data:
  grafana_data:
  pg_backups:
  chroma_backups:
